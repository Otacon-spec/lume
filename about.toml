# Configurazione di cargo-about: genera THIRD_PARTY_LICENSES.md, i testi di
# licenza di ogni crate che finisce nel binario distribuito.
#
#   cargo about generate -c about.toml about.hbs -o THIRD_PARTY_LICENSES.md
#
# Da rigenerare quando cambia Cargo.lock. Una licenza nuova fuori da questo
# elenco fa fallire la generazione: va valutata, non aggiunta alla cieca.
accepted = [
    # Preferita quando il crate la offre come alternativa: alcuni pacchetti
    # non distribuiscono un file MIT con il titolare e cargo-about usa il
    # segnaposto generico. L'insieme delle licenze accettate resta invariato.
    "Zlib",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

# Titolari veri al posto dei testi generici: chrono ha un workaround
# integrato in cargo-about 0.9.2.
workarounds = ["chrono"]

# Target distribuiti: Windows x64, Linux x86_64, macOS Intel e Apple Silicon.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Né le dipendenze di build né quelle di test finiscono nell'eseguibile.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# I crate privati di Lume (publish=false) usano LICENSE/NOTICE Apache-2.0.
# Il renderer vendorizzato conserva la propria licenza MIT e resta nel report.
private = { ignore = true }

# Licenze accettate crate per crate, non per tutto l'albero: ognuna serve a
# un crate solo.
# - option-ext (via directories): MPL-2.0, copyleft debole a livello di file;
#   il sorgente resta quello pubblicato su crates.io, non modificato.
[option-ext]
accepted = ["MPL-2.0"]

# libdbus-sys dichiara «Apache-2.0/MIT» e include i due testi nel pacchetto;
# senza clarify cargo-about pesca l'intestazione MIT di un header C del vendor.
[libdbus-sys.clarify]
license = "MIT"
[[libdbus-sys.clarify.files]]
path = "LICENSE-MIT"
checksum = "de3911c2d98c8bd2d701ee721347053d9b55995a11f9a8c955e44d3ca1b376bf"

# `objc-sys 0.3.5` pubblica il commit che contiene questo MIT completo.
[objc-sys.clarify]
license = "MIT"
[[objc-sys.clarify.git]]
path = "LICENSE.txt"
checksum = "e353f37b12aefbb9f9b29490e837cfee05d9bda70804b3562839a3285c1df1e5"

# - webpki-roots: le radici dei certificati di Mozilla, licenza per dati.
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]

# - oracledb è «UPL-1.0 OR Apache-2.0»: basta Apache-2.0, UPL non serve.
#
# - zune-core è «MIT OR Apache-2.0 OR Zlib» e non include un file di licenza nel
#   pacchetto. La preferenza Zlib sopra evita il MIT generico; il testo completo
#   e l'attribuzione upstream restano anche nella sezione fissa di about.hbs.

# Il LICENSE composito di aws-lc-sys, con tutti i titolari.
[aws-lc-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"
[[aws-lc-sys.clarify.files]]
path = "LICENSE"
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"

