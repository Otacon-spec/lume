[package]
name = "lume-sql"
description = "Modalità SQL di Lume: Azure SQL e Oracle, in Rust puro, caricati solo su richiesta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
futures = { workspace = true }
thiserror = { workspace = true }
tiberius-ng = { workspace = true }
oracledb = { workspace = true }
# `net` e `io-util` servono a tiberius; il runtime e' `current_thread`, uno per
# thread di connessione, quindi nessun pool aggiuntivo.
tokio = { workspace = true, features = ["net", "io-util", "macros"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
keyring-core = { workspace = true }
zeroize = { workspace = true }

# Gli store espliciti: `vault.rs` sceglie quello della piattaforma con un
# `cfg`, come faceva la feature `v1` di keyring 4.2. Su Linux `vendored`
# compila libdbus dal sorgente, quindi non servono `libdbus-1-dev` né una
# libdbus di sistema; serve un compilatore C (cc), come per aws-lc-rs.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true }

[lints]
workspace = true
